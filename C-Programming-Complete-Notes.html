<script>
/* ============================================================
   1. CONTENT DATA  (all notes, organized as sections)
   ============================================================ */
const SECTIONS = [];
function sec(id, title, group, html){ SECTIONS.push({id,title,group,html}); }

/* ---------- helper for code blocks ---------- */
function hl(code){
  // very small syntax highlighter (not a full lexer, just visual)
  const kws = ['int','float','double','char','void','return','if','else','for','while','do',
    'switch','case','break','continue','struct','typedef','sizeof','static','const','unsigned',
    'signed','long','short','include','define','main','goto','default','union','enum','class',
    'public','private','virtual','new','this','extern'];
  let esc = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  esc = esc.replace(/(\/\/.*$)/gm,'<span class="com">$1</span>');
  esc = esc.replace(/(&quot;.*?&quot;|"[^"]*")/g,'<span class="str">$1</span>');
  esc = esc.replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
  const kwRe = new RegExp('\\b('+kws.join('|')+')\\b','g');
  esc = esc.replace(kwRe,'<span class="kw">$1</span>');
  esc = esc.replace(/\b([a-zA-Z_]\w*)\s(?=\()/g,'<span class="fn">$1</span> ');
  return esc;
}
let CODE_ID = 0;
function codeblock(label, code, output){
  const id = 'code-out-'+(CODE_ID++);
  const outBtn = output ? `<button onclick="toggleOut('${id}')">▶ Show Expected Output</button>` : '';
  const outDiv = output ? `<div class="out" id="${id}">${output.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>` : '';
  return `<div class="codewrap">
    <div class="codehead"><span>${label||'C'}</span>
      <span>
        <button onclick="copyCode(this)" data-code="${encodeURIComponent(code)}">⧉ Copy</button>
        ${outBtn}
      </span>
    </div>
    <pre><code>${hl(code)}</code></pre>
    ${outDiv}
  </div>`;
}
function toggleOut(id){ document.getElementById(id).classList.toggle('show'); }
function copyCode(btn){
  const code = decodeURIComponent(btn.getAttribute('data-code'));
  navigator.clipboard.writeText(code).then(()=>{ const t=btn.textContent; btn.textContent='✓ Copied'; setTimeout(()=>btn.textContent=t,1200); });
}

sec('history','History & Creator','1. Introduction', `
<h2>History of C — Who Created It?</h2>
<div class="card">
<p><b>C was created by Dennis Ritchie</b> at Bell Labs (AT&T) between <b>1969–1973</b>. It was
developed to re-implement the Unix operating system, which was originally written in assembly
language.</p>
<table>
<tr><th>Year</th><th>Event</th></tr>
<tr><td>1960s</td><td>ALGOL, CPL, and BCPL languages laid conceptual groundwork.</td></tr>
<tr><td>1967</td><td>Martin Richards develops <b>BCPL</b>.</td></tr>
<tr><td>1970</td><td>Ken Thompson creates <b>B language</b> (simplified BCPL) at Bell Labs.</td></tr>
<tr><td>1972</td><td><b>Dennis Ritchie</b> develops <b>C</b> as an evolution of B, adding data types.</td></tr>
<tr><td>1973</td><td>Unix kernel rewritten in C — a landmark moment for portability.</td></tr>
<tr><td>1978</td><td>Kernighan & Ritchie publish <i>"The C Programming Language"</i> (the "K&R" book).</td></tr>
<tr><td>1989/1990</td><td>ANSI C (C89) / ISO C (C90) — first official standard.</td></tr>
<tr><td>1999</td><td>C99 standard — new features like inline functions, // comments.</td></tr>
<tr><td>2011</td><td>C11 standard — multithreading, better Unicode support.</td></tr>
<tr><td>2018+</td><td>C17/C18 (bugfix release), C23 (latest major revision).</td></tr>
</table>
<p><b>Why the name "C"?</b> Because it evolved directly from a language called <b>"B"</b> — the next
letter in the alphabet.</p>
</div>
<h3>Why C matters</h3>
<div class="card"><p>C is often called the <b>"mother of all modern languages"</b> because C++, Java,
C#, Python (CPython interpreter itself is written in C), JavaScript engines, and most operating
system kernels (Linux, Windows, Unix) either derive syntax from C or are implemented in C.</p></div>
`);

sec('features','Features','1. Introduction', `
<h2>Features of C</h2>
<div class="card"><table>
<tr><th>Feature</th><th>Explanation</th></tr>
<tr><td><b>Simple & Structured</b></td><td>Programs are broken into functions/blocks, making logic easy to follow.</td></tr>
<tr><td><b>Fast / Efficient</b></td><td>Compiles to machine code directly with minimal runtime overhead.</td></tr>
<tr><td><b>Portable</b></td><td>A C program written on one machine can run on another with little/no change (write once, compile anywhere).</td></tr>
<tr><td><b>Low-level access</b></td><td>Supports pointers, direct memory access and bitwise operations — close to hardware.</td></tr>
<tr><td><b>Rich Library</b></td><td>Standard library (stdio.h, stdlib.h, string.h, math.h, etc.) for common tasks.</td></tr>
<tr><td><b>Extensible</b></td><td>You can add your own functions and libraries.</td></tr>
<tr><td><b>Middle-level language</b></td><td>Combines features of low-level (assembly-like control) and high-level (readable syntax) languages.</td></tr>
<tr><td><b>Recursion supported</b></td><td>Functions can call themselves.</td></tr>
<tr><td><b>Dynamic memory management</b></td><td>malloc(), calloc(), free(), realloc() let you manage memory manually.</td></tr>
<tr><td><b>Case sensitive</b></td><td><code>Sum</code> and <code>sum</code> are different identifiers.</td></tr>
</table></div>
`);

sec('adv','Advantages & Disadvantages','1. Introduction', `
<h2>Advantages & Disadvantages of C</h2>
<div class="grid2">
<div class="card"><h4 class="badge-good">✔ Advantages</h4>
<ul>
<li>Extremely fast execution — close to hardware.</li>
<li>Portable across platforms with minimal changes.</li>
<li>Forms the foundation for learning other languages (C++, Java, C#, Rust concepts).</li>
<li>Rich set of built-in operators and functions.</li>
<li>Gives full control over memory via pointers.</li>
<li>Used to build OS kernels, embedded systems, compilers, device drivers.</li>
<li>Modular — code can be divided into functions/files.</li>
</ul></div>
<div class="card"><h4 class="badge-bad">✘ Disadvantages</h4>
<ul>
<li>No built-in Object-Oriented support (no classes natively).</li>
<li>No automatic garbage collection — manual memory management can cause leaks.</li>
<li>No exception handling (unlike try/catch in Java/C++).</li>
<li>No namespaces — larger risk of naming collisions in big projects.</li>
<li>Steeper learning curve for beginners (pointers, memory).</li>
<li>Weak run-time type / bounds checking — easy to get buffer overflows.</li>
</ul></div>
</div>
`);

sec('structure','Structure of a Program','2. Basics', `
<h2>Basic Structure of a C Program</h2>
<div class="card"><p>Every C program follows this general skeleton:</p>
${codeblock('structure.c',
`#include <stdio.h>      // 1. Preprocessor directive (headers)

#define PI 3.14          // 2. Macro definitions (optional)

int globalVar = 10;      // 3. Global declarations (optional)

int add(int a, int b);   // 4. Function prototype (optional)

int main() {              // 5. main() -- program execution starts here
    int x = 5;             // Local variable declaration
    printf("Sum = %d", add(x, globalVar)); // Statements
    return 0;               // 6. Return statement
}

int add(int a, int b) {   // 7. Function definition
    return a + b;
}`, `Sum = 15`)}
<h4>Explanation of each part</h4>
<ul>
<li><b>Preprocessor directives</b> (<code>#include</code>) — tell the compiler to include header files before compiling.</li>
<li><b>main() function</b> — every C program must have exactly one <code>main()</code>; execution always starts here.</li>
<li><b>Statements</b> — instructions ending with a semicolon <code>;</code>.</li>
<li><b>Comments</b> — <code>// single line</code> or <code>/* multi line */</code>, ignored by the compiler.</li>
<li><b>return 0;</b> — tells the operating system the program ended successfully (0 = success by convention).</li>
</ul>
</div>
`);

sec('datatypes','Data Types & Variables','2. Basics', `
<h2>Data Types & Variables</h2>
<div class="card"><p>A <b>data type</b> tells the compiler what kind of value a variable holds and how
much memory to reserve. A <b>variable</b> is a named storage location whose value can change.</p>
<table>
<tr><th>Type</th><th>Typical Size</th><th>Example</th><th>Use</th></tr>
<tr><td><code>int</code></td><td>4 bytes</td><td><code>int age = 21;</code></td><td>Whole numbers</td></tr>
<tr><td><code>float</code></td><td>4 bytes</td><td><code>float pi = 3.14f;</code></td><td>Decimal numbers (single precision)</td></tr>
<tr><td><code>double</code></td><td>8 bytes</td><td><code>double d = 3.14159265;</code></td><td>Decimal numbers (double precision)</td></tr>
<tr><td><code>char</code></td><td>1 byte</td><td><code>char grade = 'A';</code></td><td>Single character</td></tr>
<tr><td><code>void</code></td><td>—</td><td><code>void func();</code></td><td>No value / empty type</td></tr>
<tr><td><code>short / long</code></td><td>2 / 4-8 bytes</td><td><code>long int x;</code></td><td>Size modifiers</td></tr>
<tr><td><code>unsigned</code></td><td>same size</td><td><code>unsigned int u;</code></td><td>Only positive values, doubles the positive range</td></tr>
</table>
<h4>Variable rules</h4>
<ul><li>Must start with a letter or underscore, not a digit.</li>
<li>Cannot use C keywords (like <code>int</code>, <code>return</code>) as names.</li>
<li>Case-sensitive: <code>Total</code> ≠ <code>total</code>.</li>
<li>Should be declared before use: <code>type name = value;</code></li></ul>
${codeblock('datatypes.c',
`#include <stdio.h>
int main() {
    int age = 21;
    float price = 99.5f;
    double pi = 3.14159265;
    char grade = 'A';
    printf("Age: %d\\n", age);
    printf("Price: %.2f\\n", price);
    printf("Pi: %lf\\n", pi);
    printf("Grade: %c\\n", grade);
    return 0;
}`, `Age: 21\nPrice: 99.50\nPi: 3.141593\nGrade: A`)}
</div>
`);

sec('operators','Operators (All Types)','3. Operators', `
<h2>What is an Operator?</h2>
<div class="card"><p>An <b>operator</b> is a symbol that tells the compiler to perform a specific
mathematical, relational or logical operation on one or more values (called <b>operands</b>).
Example: in <code>a + b</code>, <code>+</code> is the operator, and <code>a</code>, <code>b</code>
are operands.</p></div>

<h3>Types of Operators in C</h3>

<h4>1. Arithmetic Operators</h4>
<div class="card"><table><tr><th>Operator</th><th>Meaning</th><th>Example</th></tr>
<tr><td>+</td><td>Addition</td><td>a + b</td></tr>
<tr><td>-</td><td>Subtraction</td><td>a - b</td></tr>
<tr><td>*</td><td>Multiplication</td><td>a * b</td></tr>
<tr><td>/</td><td>Division</td><td>a / b</td></tr>
<tr><td>%</td><td>Modulus (remainder)</td><td>a % b</td></tr>
</table></div>

<h4>2. Relational (Comparison) Operators — return 1 (true) or 0 (false)</h4>
<div class="card"><table><tr><th>Operator</th><th>Meaning</th></tr>
<tr><td>==</td><td>Equal to</td></tr><tr><td>!=</td><td>Not equal to</td></tr>
<tr><td>&gt;</td><td>Greater than</td></tr><tr><td>&lt;</td><td>Less than</td></tr>
<tr><td>&gt;=</td><td>Greater or equal</td></tr><tr><td>&lt;=</td><td>Less or equal</td></tr>
</table></div>

<h4>3. Logical Operators</h4>
<div class="card"><table><tr><th>Operator</th><th>Meaning</th></tr>
<tr><td>&&</td><td>Logical AND — true if both conditions true</td></tr>
<tr><td>||</td><td>Logical OR — true if at least one condition true</td></tr>
<tr><td>!</td><td>Logical NOT — reverses the result</td></tr>
</table></div>

<h4>4. Assignment Operators</h4>
<div class="card"><table><tr><th>Operator</th><th>Same as</th></tr>
<tr><td>=</td><td>a = b</td></tr><tr><td>+=</td><td>a = a + b</td></tr>
<tr><td>-=</td><td>a = a - b</td></tr><tr><td>*=</td><td>a = a * b</td></tr>
<tr><td>/=</td><td>a = a / b</td></tr><tr><td>%=</td><td>a = a % b</td></tr>
</table></div>

<h4>5. Increment / Decrement Operators</h4>
<div class="card"><p><code>++</code> increases a value by 1, <code>--</code> decreases by 1.
<b>Pre</b> (<code>++a</code>) changes the value first then uses it; <b>Post</b> (<code>a++</code>)
uses the current value first then changes it.</p>
${codeblock('increment.c',
`int a = 5;
printf("%d", a++); // prints 5, then a becomes 6
printf("%d", ++a); // a becomes 7, then prints 7`, `5 7`)}
</div>

<h4>6. Bitwise Operators — operate on individual bits</h4>
<div class="card"><table><tr><th>Operator</th><th>Meaning</th></tr>
<tr><td>&</td><td>Bitwise AND</td></tr><tr><td>|</td><td>Bitwise OR</td></tr>
<tr><td>^</td><td>Bitwise XOR</td></tr><tr><td>~</td><td>Bitwise NOT (complement)</td></tr>
<tr><td>&lt;&lt;</td><td>Left shift</td></tr><tr><td>&gt;&gt;</td><td>Right shift</td></tr>
</table></div>

<h4>7. Conditional (Ternary) Operator</h4>
<div class="card">${codeblock('ternary.c',
`int a = 10, b = 20;
int max = (a > b) ? a : b;   // condition ? value_if_true : value_if_false
printf("Max = %d", max);`, `Max = 20`)}</div>

<h4>8. Special Operators</h4>
<div class="card"><ul>
<li><code>sizeof()</code> — returns size (in bytes) of a type/variable.</li>
<li><code>&</code> — address-of operator, gets memory address of a variable.</li>
<li><code>*</code> — dereference / pointer operator, accesses value at an address.</li>
<li><code>,</code> — comma operator, evaluates multiple expressions left-to-right.</li>
</ul></div>
`);

sec('io','Input / Output','3. Operators', `
<h2>Input & Output in C</h2>
<div class="card"><p><code>printf()</code> displays output; <code>scanf()</code> reads input from
the keyboard. Both live in <code>stdio.h</code> (Standard Input Output header).</p>
${codeblock('io.c',
`#include <stdio.h>
int main() {
    int age;
    printf("Enter your age: ");
    scanf("%d", &age);          // & gives the address to store input into
    printf("You are %d years old\\n", age);
    return 0;
}`, `Enter your age: 21\nYou are 21 years old`)}
<h4>Common format specifiers</h4>
<table><tr><th>Specifier</th><th>Type</th></tr>
<tr><td>%d</td><td>int</td></tr><tr><td>%f</td><td>float</td></tr>
<tr><td>%lf</td><td>double</td></tr><tr><td>%c</td><td>char</td></tr>
<tr><td>%s</td><td>string</td></tr><tr><td>%x</td><td>hexadecimal</td></tr></table>
</div>
`);

sec('control','Control / Decision Statements','4. Control Flow', `
<h2>Control Statements (Decision Making)</h2>
<div class="card"><p>Normally a program runs top-to-bottom. <b>Control statements</b> let the
program choose different paths depending on a condition — this is what gives programs "logic".</p></div>

<h3>if statement</h3>
<div class="card"><p>Executes a block <b>only if</b> the condition is true.</p>
${codeblock('if.c',
`int age = 20;
if (age >= 18) {
    printf("Eligible to vote");
}`, `Eligible to vote`)}</div>

<h3>if...else statement</h3>
<div class="card"><p>Runs one block if true, another if false.</p>
${codeblock('ifelse.c',
`int num = 7;
if (num % 2 == 0) {
    printf("Even");
} else {
    printf("Odd");
}`, `Odd`)}</div>

<h3>else if ladder</h3>
<div class="card"><p>Used to check multiple conditions in sequence.</p>
${codeblock('elseif.c',
`int marks = 75;
if (marks >= 90) printf("Grade A");
else if (marks >= 75) printf("Grade B");
else if (marks >= 50) printf("Grade C");
else printf("Fail");`, `Grade B`)}</div>

<h3>Nested if</h3>
<div class="card"><p>An if statement inside another if — used when a decision depends on
another decision.</p>
${codeblock('nested.c',
`int age = 25; char licence = 'y';
if (age >= 18) {
    if (licence == 'y') printf("Can drive");
    else printf("Get a licence first");
} else {
    printf("Too young");
}`, `Can drive`)}</div>

<h3>switch statement</h3>
<div class="card"><p>A cleaner alternative to a long else-if ladder when comparing ONE variable
against several fixed values. <code>break</code> stops it from "falling through" into the next case.</p>
${codeblock('switch.c',
`int day = 3;
switch (day) {
    case 1: printf("Monday"); break;
    case 2: printf("Tuesday"); break;
    case 3: printf("Wednesday"); break;
    default: printf("Invalid day");
}`, `Wednesday`)}</div>
`);

sec('loops','Loops — while, for, do-while','4. Control Flow', `
<h2>Loops in C</h2>
<div class="card"><p><b>Why do we need loops?</b> Without loops, repeating an action (e.g. printing
numbers 1 to 100) would need 100 separate lines of code. A <b>loop</b> repeats a block of
statements automatically as long as a given <b>condition</b> stays true — saving code and
making programs dynamic (they can repeat 5 times or 5 million times using the same few lines).</p>
<p>Every loop needs 3 things to avoid running forever (an "infinite loop"):</p>
<ol><li><b>Initialization</b> — starting point (e.g. <code>i = 1</code>)</li>
<li><b>Condition</b> — checked before each repeat; loop stops when this becomes false</li>
<li><b>Update/Increment</b> — changes the variable so the condition eventually becomes false</li></ol>
</div>

<h3>1. for loop</h3>
<div class="card"><p>Best when you know <b>exactly how many times</b> to repeat. All 3 parts
(init; condition; update) sit together in the parentheses, which makes the loop easy to read at a glance.</p>
${codeblock('for.c',
`#include <stdio.h>
int main() {
    for (int i = 1; i <= 5; i++) {
        printf("%d ", i);
    }
    return 0;
}`, `1 2 3 4 5 `)}
<p><b>How it works step by step:</b> i=1 → check 1&lt;=5 true → print 1 → i becomes 2 → check
2&lt;=5 true → print 2 ... → i becomes 6 → check 6&lt;=5 false → loop stops.</p>
</div>

<h3>2. while loop</h3>
<div class="card"><p>Best when you <b>don't know in advance</b> how many times to repeat — it keeps
going as long as the condition is true. The condition is checked <b>before</b> each iteration, so
if it's false at the start, the loop body never runs.</p>
${codeblock('while.c',
`#include <stdio.h>
int main() {
    int i = 1;
    while (i <= 5) {
        printf("%d ", i);
        i++;
    }
    return 0;
}`, `1 2 3 4 5 `)}
</div>

<h3>3. do...while loop</h3>
<div class="card"><p>Same as while, but the condition is checked <b>after</b> the body runs — so
the body always executes <b>at least once</b>, even if the condition is false from the start.
Common use: menu-driven programs that must show the menu at least one time.</p>
${codeblock('dowhile.c',
`#include <stdio.h>
int main() {
    int i = 1;
    do {
        printf("%d ", i);
        i++;
    } while (i <= 5);
    return 0;
}`, `1 2 3 4 5 `)}
</div>

<h3>Comparison: which loop to use?</h3>
<div class="card"><table>
<tr><th>Loop</th><th>Condition checked</th><th>Best for</th></tr>
<tr><td>for</td><td>Before each run</td><td>Known/fixed number of repetitions</td></tr>
<tr><td>while</td><td>Before each run</td><td>Unknown repetitions, condition-driven</td></tr>
<tr><td>do-while</td><td>After each run</td><td>Must execute at least once (e.g. menus)</td></tr>
</table></div>

<h3>Loop control: break, continue, goto</h3>
<div class="card">
<p><b>break</b> — immediately exits the loop entirely.</p>
${codeblock('break.c',
`for (int i = 1; i <= 10; i++) {
    if (i == 5) break;   // stop the loop completely when i is 5
    printf("%d ", i);
}`, `1 2 3 4 `)}
<p><b>continue</b> — skips the rest of the current iteration and jumps to the next one.</p>
${codeblock('continue.c',
`for (int i = 1; i <= 5; i++) {
    if (i == 3) continue; // skip printing 3, but keep looping
    printf("%d ", i);
}`, `1 2 4 5 `)}
<p><b>goto</b> — jumps to a labeled line. Rarely used in modern code because it makes logic
hard to follow ("spaghetti code"), but it exists in C.</p>
${codeblock('goto.c',
`int i = 1;
start:
if (i <= 3) {
    printf("%d ", i);
    i++;
    goto start;
}`, `1 2 3 `)}
</div>

<h3>Nested loops</h3>
<div class="card"><p>A loop inside another loop — the inner loop completes fully for every single
iteration of the outer loop. Commonly used for patterns, matrices, and grids.</p>
${codeblock('nestedloop.c',
`for (int i = 1; i <= 3; i++) {
    for (int j = 1; j <= i; j++) {
        printf("*");
    }
    printf("\\n");
}`, `*\n**\n***\n`)}
</div>
`);

sec('functions','Functions & Recursion','5. Functions', `
<h2>Functions</h2>
<div class="card"><p>A <b>function</b> is a named, reusable block of code that performs a specific
task. Functions avoid repeating code, make programs modular, and easier to debug/test.</p>
${codeblock('function.c',
`#include <stdio.h>
int add(int a, int b) {      // function definition
    return a + b;
}
int main() {
    int result = add(3, 4);  // function call
    printf("Result = %d", result);
    return 0;
}`, `Result = 7`)}
<h4>Parts of a function</h4>
<ul><li><b>Return type</b> — data type of the value it sends back (<code>void</code> if nothing).</li>
<li><b>Name</b> — identifier used to call it.</li>
<li><b>Parameters</b> — inputs it accepts (can be empty).</li>
<li><b>Body</b> — the code that runs; <code>return</code> sends a value back to the caller.</li></ul>
</div>

<h3>Call by Value vs Call by Reference</h3>
<div class="card">
<p><b>Call by value</b> — a <i>copy</i> of the argument is passed; changes inside the function do
NOT affect the original variable.</p>
${codeblock('callbyvalue.c',
`void change(int x) { x = 100; }
int main() {
    int a = 5;
    change(a);
    printf("%d", a); // still 5
}`, `5`)}
<p><b>Call by reference</b> — the function receives the <i>address</i> (via a pointer), so it can
modify the original variable directly.</p>
${codeblock('callbyref.c',
`void change(int *x) { *x = 100; }
int main() {
    int a = 5;
    change(&a);
    printf("%d", a); // now 100
}`, `100`)}
</div>

<h3>Recursion</h3>
<div class="card"><p>A function that calls <b>itself</b> to solve a smaller version of the same
problem, until it hits a <b>base case</b> that stops the recursion. Useful for problems that are
naturally defined in terms of themselves (factorial, Fibonacci, tree traversal).</p>
${codeblock('recursion.c',
`int factorial(int n) {
    if (n == 0) return 1;         // base case — stops recursion
    return n * factorial(n - 1);  // recursive case
}
int main() {
    printf("%d", factorial(5));   // 5*4*3*2*1
}`, `120`)}
</div>
`);

sec('arrays','Arrays','6. Arrays & Strings', `
<h2>Arrays</h2>
<div class="card"><p>An <b>array</b> is a collection of elements of the <i>same</i> data type,
stored in <i>contiguous</i> memory, accessed using an <b>index</b> starting at 0.</p>
${codeblock('array.c',
`#include <stdio.h>
int main() {
    int marks[5] = {90, 85, 70, 60, 95};
    for (int i = 0; i < 5; i++) {
        printf("%d ", marks[i]);
    }
    return 0;
}`, `90 85 70 60 95 `)}
<h4>Key points</h4>
<ul><li>Size is fixed at declaration (in a normal C array).</li>
<li>Index runs from <code>0</code> to <code>size-1</code>.</li>
<li>2D arrays (<code>int grid[3][3]</code>) represent tables/matrices.</li></ul>
${codeblock('array2d.c',
`int grid[2][2] = {{1,2},{3,4}};
for (int i=0;i<2;i++)
  for (int j=0;j<2;j++)
    printf("%d ", grid[i][j]);`, `1 2 3 4 `)}
</div>
`);

sec('strings','Strings','6. Arrays & Strings', `
<h2>Strings in C</h2>
<div class="card"><p>C has no built-in string type — a string is simply a <b>character array</b>
ending with a special null character <code>'\\0'</code> that marks where the string ends.</p>
${codeblock('string.c',
`#include <stdio.h>
#include <string.h>
int main() {
    char name[20] = "Claude";
    printf("Name: %s\\n", name);
    printf("Length: %d\\n", (int)strlen(name));
    return 0;
}`, `Name: Claude\nLength: 6`)}
<h4>Common string.h functions</h4>
<table><tr><th>Function</th><th>Purpose</th></tr>
<tr><td>strlen(s)</td><td>Length of string</td></tr>
<tr><td>strcpy(a,b)</td><td>Copy b into a</td></tr>
<tr><td>strcat(a,b)</td><td>Append b to a</td></tr>
<tr><td>strcmp(a,b)</td><td>Compare two strings (0 = equal)</td></tr></table>
</div>
`);

sec('pointers','Pointers','7. Pointers & Memory', `
<h2>Pointers</h2>
<div class="card"><p>A <b>pointer</b> is a variable that stores the <b>memory address</b> of
another variable, instead of a normal value. Pointers are what give C its low-level power —
they allow direct memory access, dynamic memory allocation, and efficient array/function handling.</p>
${codeblock('pointer.c',
`#include <stdio.h>
int main() {
    int a = 10;
    int *p = &a;     // p stores the address of a
    printf("Value of a: %d\\n", a);
    printf("Address of a: %p\\n", (void*)&a);
    printf("Value via pointer: %d\\n", *p); // *p = dereference
    return 0;
}`, `Value of a: 10\nAddress of a: 0x7ffee...\nValue via pointer: 10`)}
<h4>Key symbols</h4>
<ul><li><code>&var</code> — "address of" — gets the memory location.</li>
<li><code>*ptr</code> — "value at" (dereference) — gets the value stored at that address.</li></ul>
</div>
<h3>Dynamic Memory Allocation</h3>
<div class="card"><p>Memory can be requested while the program is running (heap memory), using
functions from <code>stdlib.h</code>. This is essential when the amount of data isn't known until
runtime.</p>
<table><tr><th>Function</th><th>Purpose</th></tr>
<tr><td>malloc(size)</td><td>Allocates raw memory, uninitialized</td></tr>
<tr><td>calloc(n,size)</td><td>Allocates and zero-initializes memory</td></tr>
<tr><td>realloc(ptr,size)</td><td>Resizes previously allocated memory</td></tr>
<tr><td>free(ptr)</td><td>Releases memory back to the system</td></tr></table>
${codeblock('malloc.c',
`int *arr = (int*) malloc(5 * sizeof(int));
if (arr != NULL) {
    for (int i=0;i<5;i++) arr[i] = i*i;
    for (int i=0;i<5;i++) printf("%d ", arr[i]);
    free(arr); // always free what you malloc!
}`, `0 1 4 9 16 `)}
</div>
`);

sec('structs','Structures & Unions','8. Structures', `
<h2>Structures</h2>
<div class="card"><p>A <b>structure</b> (<code>struct</code>) groups <i>different</i> data types
together under one name — useful for representing a real-world "record" like a student or a point.</p>
${codeblock('struct.c',
`#include <stdio.h>
struct Student {
    char name[20];
    int age;
    float gpa;
};
int main() {
    struct Student s1 = {"Alex", 20, 3.8};
    printf("%s is %d years old, GPA %.1f", s1.name, s1.age, s1.gpa);
    return 0;
}`, `Alex is 20 years old, GPA 3.8`)}
</div>
<h3>Union</h3>
<div class="card"><p>A <b>union</b> looks similar to a struct, but all its members <b>share the
same memory location</b> — so it only ever holds one member's value at a time. This saves memory
when you only need one of several possible values.</p>
${codeblock('union.c',
`union Data { int i; float f; };
union Data d;
d.i = 10;
printf("%d", d.i); // 10 -- but d.f would now be garbage`, `10`)}
</div>
`);

sec('files','File Handling','9. Files', `
<h2>File Handling</h2>
<div class="card"><p>C can read/write files using a <code>FILE*</code> pointer and functions from
<code>stdio.h</code> — useful for saving data permanently (unlike variables, which vanish when the
program ends).</p>
${codeblock('file.c',
`#include <stdio.h>
int main() {
    FILE *fp = fopen("data.txt", "w");  // open for writing
    if (fp != NULL) {
        fprintf(fp, "Hello File!");
        fclose(fp);                      // always close what you open
    }
    return 0;
}`)}
<table><tr><th>Mode</th><th>Meaning</th></tr>
<tr><td>"r"</td><td>Read (file must exist)</td></tr>
<tr><td>"w"</td><td>Write (creates/overwrites)</td></tr>
<tr><td>"a"</td><td>Append (adds to end)</td></tr>
<tr><td>"r+"</td><td>Read and write</td></tr></table>
</div>
`);

sec('oop','OOP Concepts (Class, Object, Inheritance, Polymorphism)','10. OOP in C / C++', `
<h2>Object-Oriented Programming — and how it relates to C</h2>
<div class="card"><p><b>Important:</b> plain C is a <i>procedural</i> language — it has <b>no
built-in classes, inheritance, or polymorphism</b>. Those concepts belong to <b>C++</b> (which is
literally "C with Classes") and other OOP languages like Java. However, C programmers commonly
<i>simulate</i> OOP ideas using <code>struct</code> + function pointers. Below, both approaches are shown.</p></div>

<h3>Class & Object</h3>
<div class="card"><p><b>Class</b> = a blueprint/template describing what data and behaviour an
object will have. <b>Object</b> = an actual instance created from that blueprint, with its own
data in memory.</p>
${codeblock('class.cpp — C++',
`class Car {              // class = blueprint
public:
    string brand;
    void honk() { cout << brand << " says Beep!"; }
};
int main() {
    Car myCar;            // object = instance of the class
    myCar.brand = "Toyota";
    myCar.honk();
}`, `Toyota says Beep!`)}
<p><b>Simulating a "class" in plain C</b> using a struct + a function that takes it:</p>
${codeblock('class_sim.c',
`struct Car { char brand[20]; };
void honk(struct Car *c) { printf("%s says Beep!", c->brand); }
int main() {
    struct Car myCar = {"Toyota"};
    honk(&myCar);
}`, `Toyota says Beep!`)}
</div>

<h3>Inheritance</h3>
<div class="card"><p>Lets one class (<b>child/derived</b>) reuse and extend the data/behaviour of
another class (<b>parent/base</b>) — models an "is-a" relationship, e.g. a <i>Car</i> "is a"
<i>Vehicle</i>.</p>
${codeblock('inherit.cpp — C++',
`class Vehicle { public: void start(){ cout << "Engine started"; } };
class Car : public Vehicle { public: void wheels(){ cout << ", 4 wheels"; } };
int main() {
    Car c;
    c.start();   // inherited from Vehicle
    c.wheels();  // Car's own method
}`, `Engine started, 4 wheels`)}
<p>In plain C, this is simulated by <b>embedding</b> one struct inside another (composition):</p>
${codeblock('inherit_sim.c',
`struct Vehicle { int wheels; };
struct Car { struct Vehicle base; char brand[10]; };
int main() {
    struct Car c = {{4}, "Toyota"};
    printf("%s has %d wheels", c.brand, c.base.wheels);
}`, `Toyota has 4 wheels`)}
</div>

<h3>Polymorphism</h3>
<div class="card"><p>"Many forms" — the same function name behaves differently depending on the
object or arguments. In C++/Java this happens via <b>method overriding</b> (child class redefines a
parent method) or <b>overloading</b> (same name, different parameters).</p>
${codeblock('poly.cpp — C++',
`class Animal { public: virtual void sound(){ cout << "..."; } };
class Dog : public Animal { public: void sound() override { cout << "Woof"; } };
class Cat : public Animal { public: void sound() override { cout << "Meow"; } };
int main() {
    Animal* a1 = new Dog();
    Animal* a2 = new Cat();
    a1->sound();  // Woof
    a2->sound();  // Meow
}`, `Woof Meow`)}
<p>C simulates this using <b>function pointers</b> inside a struct:</p>
${codeblock('poly_sim.c',
`struct Animal { void (*sound)(); };
void dogSound(){ printf("Woof "); }
void catSound(){ printf("Meow "); }
int main() {
    struct Animal a1 = { dogSound };
    struct Animal a2 = { catSound };
    a1.sound();
    a2.sound();
}`, `Woof Meow `)}
</div>

<h3>Encapsulation & Abstraction (quick note)</h3>
<div class="card"><ul>
<li><b>Encapsulation</b> — bundling data + the functions that operate on it together, and
restricting direct outside access (private/public in C++). In C, this is loosely simulated by
keeping struct fields "internal" and only exposing functions to modify them.</li>
<li><b>Abstraction</b> — hiding internal implementation details and exposing only what's necessary
(e.g. you use <code>printf()</code> without knowing how it writes bytes to the terminal).</li>
</ul></div>
`);

sec('ds','Data Structures in C','11. Data Structures', `
<h2>Data Structures in C</h2>
<div class="card"><p>A <b>data structure</b> is a way of organizing and storing data so it can be
used efficiently. C is commonly used to implement these from scratch because it gives full control
over memory via pointers and structs.</p></div>

<h3>1. Stack (LIFO — Last In, First Out)</h3>
<div class="card"><p>Elements are added/removed only from the <b>top</b> — like a stack of plates.
Used in: undo functionality, expression evaluation, function call management (call stack).</p>
${codeblock('stack.c',
`#include <stdio.h>
#define MAX 5
int stack[MAX], top = -1;

void push(int val) {
    if (top == MAX-1) { printf("Stack Overflow\\n"); return; }
    stack[++top] = val;
}
int pop() {
    if (top == -1) { printf("Stack Underflow\\n"); return -1; }
    return stack[top--];
}
int main() {
    push(10); push(20); push(30);
    printf("Popped: %d\\n", pop());
    printf("Popped: %d\\n", pop());
    return 0;
}`, `Popped: 30\nPopped: 20`)}
</div>

<h3>2. Queue (FIFO — First In, First Out)</h3>
<div class="card"><p>Elements are added at the <b>rear</b> and removed from the <b>front</b> —
like people in a line. Used in: scheduling, printer queues, breadth-first search.</p>
${codeblock('queue.c',
`#include <stdio.h>
#define MAX 5
int queue[MAX], front = -1, rear = -1;

void enqueue(int val) {
    if (rear == MAX-1) { printf("Queue Full\\n"); return; }
    if (front == -1) front = 0;
    queue[++rear] = val;
}
int dequeue() {
    if (front == -1 || front > rear) { printf("Queue Empty\\n"); return -1; }
    return queue[front++];
}
int main() {
    enqueue(10); enqueue(20); enqueue(30);
    printf("Dequeued: %d\\n", dequeue());
    printf("Dequeued: %d\\n", dequeue());
    return 0;
}`, `Dequeued: 10\nDequeued: 20`)}
</div>

<h3>3. Linked List</h3>
<div class="card"><p>A chain of <b>nodes</b>, where each node holds data + a pointer to the next
node. Unlike arrays, its size can grow/shrink dynamically at runtime.</p>
${codeblock('linkedlist.c',
`#include <stdio.h>
#include <stdlib.h>
struct Node { int data; struct Node *next; };

void printList(struct Node *n) {
    while (n != NULL) { printf("%d -> ", n->data); n = n->next; }
    printf("NULL\\n");
}
int main() {
    struct Node *head = malloc(sizeof(struct Node));
    struct Node *second = malloc(sizeof(struct Node));
    struct Node *third = malloc(sizeof(struct Node));
    head->data = 1;   head->next = second;
    second->data = 2; second->next = third;
    third->data = 3;  third->next = NULL;
    printList(head);
    return 0;
}`, `1 -> 2 -> 3 -> NULL`)}
</div>

<h3>4. Sorting example — Bubble Sort</h3>
<div class="card"><p>Repeatedly compares adjacent elements and swaps them if they're in the wrong
order, "bubbling" the largest value to the end each pass.</p>
${codeblock('bubblesort.c',
`#include <stdio.h>
int main() {
    int arr[] = {5, 2, 9, 1, 5};
    int n = 5;
    for (int i = 0; i < n-1; i++)
        for (int j = 0; j < n-i-1; j++)
            if (arr[j] > arr[j+1]) {
                int t = arr[j]; arr[j] = arr[j+1]; arr[j+1] = t;
            }
    for (int i = 0; i < n; i++) printf("%d ", arr[i]);
    return 0;
}`, `1 2 5 5 9 `)}
</div>
`);

/* ---- Tokenizer ---- */
function tokenize(src){
  // strip comments
  src = src.replace(/\/\/.*$/gm,'').replace(/\/\*[\s\S]*?\*\//g,'');
  const tokens = [];
  let i=0;
  const isDigit = c=>/[0-9]/.test(c);
  const isAlpha = c=>/[A-Za-z_]/.test(c);
  while(i<src.length){
    const c = src[i];
    if(/\s/.test(c)){ i++; continue; }
    if(c === '"'){
      let j=i+1, s='';
      while(j<src.length && src[j] !== '"'){
        if(src[j]==='\\' && j+1<src.length){
          const n=src[j+1];
          if(n==='n') s+='\n'; else if(n==='t') s+='\t'; else s+=n;
          j+=2;
        } else { s+=src[j]; j++; }
      }
      tokens.push({t:'string', v:s}); i=j+1; continue;
    }
    if(isDigit(c) || (c==='.'&&isDigit(src[i+1]))){
      let j=i, s='';
      while(j<src.length && /[0-9.]/.test(src[j])){ s+=src[j]; j++; }
      tokens.push({t:'number', v:parseFloat(s)}); i=j; continue;
    }
    if(isAlpha(c)){
      let j=i, s='';
      while(j<src.length && /[A-Za-z0-9_]/.test(src[j])){ s+=src[j]; j++; }
      tokens.push({t:'id', v:s}); i=j; continue;
    }
    // multi-char operators
    const two = src.substr(i,2);
    if(['==','!=','<=','>=','&&','||','++','--','+=','-=','*=','/='].includes(two)){
      tokens.push({t:'op', v:two}); i+=2; continue;
    }
    if('+-*/%=<>!(){}[];,&|'.includes(c)){
      tokens.push({t:'op', v:c}); i++; continue;
    }
    i++; // skip unknown char
  }
  tokens.push({t:'eof', v:null});
  return tokens;
}

/* ---- Parser: builds a simple AST ---- */
function parse(tokens){
  let pos = 0;
  const peek = ()=>tokens[pos];
  const next = ()=>tokens[pos++];
  const expect = (v)=>{ if(peek().v!==v) throw new Error('Expected "'+v+'" but got "'+peek().v+'"'); return next(); };
  const TYPES = ['int','float','double','char','void'];

  function parseProgram(){
    // skip to main() { ... } — ignore #include-like tokens (they won't tokenize as such but just in case)
    while(peek().t!=='eof' && !(peek().v==='int' && tokens[pos+1] && tokens[pos+1].v==='main')) pos++;
    if(peek().t==='eof') { pos=0; } // fallback: no main wrapper, parse whole thing as block
    if(peek().v==='int' && tokens[pos+1] && tokens[pos+1].v==='main'){
      next(); next(); expect('('); expect(')'); expect('{');
      const body = parseStatements('}');
      expect('}');
      return body;
    }
    return parseStatements('eof');
  }

  function parseStatements(endTok){
    const stmts = [];
    while(peek().v!==endTok && peek().t!=='eof'){
      stmts.push(parseStatement());
    }
    return stmts;
  }

  function parseBlock(){
    expect('{');
    const stmts = parseStatements('}');
    expect('}');
    return {type:'Block', body:stmts};
  }

  function parseStatement(){
    const tk = peek();
    if(tk.v==='return'){ next(); if(peek().v!==';') parseExpr(); if(peek().v===';') next(); return {type:'Nop'}; }
    if(TYPES.includes(tk.v)){ return parseDecl(); }
    if(tk.v==='if'){ return parseIf(); }
    if(tk.v==='for'){ return parseFor(); }
    if(tk.v==='while'){ return parseWhile(); }
    if(tk.v==='do'){ return parseDoWhile(); }
    if(tk.v==='break'){ next(); if(peek().v===';') next(); return {type:'Break'}; }
    if(tk.v==='continue'){ next(); if(peek().v===';') next(); return {type:'Continue'}; }
    if(tk.v==='{'){ return parseBlock(); }
    if(tk.v===';'){ next(); return {type:'Nop'}; }
    // expression statement (assignment, printf call, i++, etc.)
    const e = parseExpr();
    if(peek().v===';') next();
    return {type:'ExprStmt', expr:e};
  }

  function parseDecl(){
    const typeTok = next(); // int/float/...
    const decls = [];
    do {
      const nameTok = next();
      let arraySize = null, init = null;
      if(peek().v==='['){ next(); arraySize = parseExpr(); expect(']'); }
      if(peek().v==='='){
        next();
        if(peek().v==='{'){
          next();
          const vals=[];
          while(peek().v!=='}'){ vals.push(parseExpr()); if(peek().v===',') next(); }
          expect('}');
          init = {type:'ArrayLit', values:vals};
        } else {
          init = parseExpr();
        }
      }
      decls.push({name:nameTok.v, arraySize, init});
    } while(peek().v===',' && next());
    if(peek().v===';') next();
    return {type:'VarDecl', varType:typeTok.v, decls};
  }

  function parseIf(){
    next(); expect('(');
    const cond = parseExpr();
    expect(')');
    const thenB = peek().v==='{' ? parseBlock() : {type:'Block',body:[parseStatement()]};
    let elseB = null;
    if(peek().v==='else'){
      next();
      elseB = peek().v==='if' ? parseIf() : (peek().v==='{' ? parseBlock() : {type:'Block',body:[parseStatement()]});
    }
    return {type:'If', cond, thenB, elseB};
  }
  function parseFor(){
    next(); expect('(');
    let init = null;
    if(peek().v!==';'){
      if(TYPES.includes(peek().v)) init = parseDeclInline();
      else { init = {type:'ExprStmt', expr:parseExpr()}; }
    }
    if(peek().v===';') next();
    let cond = peek().v!==';' ? parseExpr() : {type:'Lit', value:1};
    if(peek().v===';') next();
    let update = peek().v!==')' ? parseExpr() : null;
    expect(')');
    const body = peek().v==='{' ? parseBlock() : {type:'Block',body:[parseStatement()]};
    return {type:'For', init, cond, update, body};
  }
  function parseDeclInline(){
    const typeTok = next();
    const nameTok = next();
    let init=null;
    if(peek().v==='='){ next(); init=parseExpr(); }
    return {type:'VarDecl', varType:typeTok.v, decls:[{name:nameTok.v, arraySize:null, init}]};
  }
  function parseWhile(){
    next(); expect('(');
    const cond = parseExpr();
    expect(')');
    const body = peek().v==='{' ? parseBlock() : {type:'Block',body:[parseStatement()]};
    return {type:'While', cond, body};
  }
  function parseDoWhile(){
    next();
    const body = peek().v==='{' ? parseBlock() : {type:'Block',body:[parseStatement()]};
    expect('while'); expect('(');
    const cond = parseExpr();
    expect(')'); if(peek().v===';') next();
    return {type:'DoWhile', cond, body};
  }

  // Expression parsing (precedence climbing)
  function parseExpr(){ return parseAssign(); }
  function parseAssign(){
    const left = parseLogicOr();
    if(['=','+=','-=','*=','/='].includes(peek().v)){
      const op = next().v;
      const right = parseAssign();
      return {type:'Assign', op, target:left, value:right};
    }
    return left;
  }
  function parseLogicOr(){
    let left = parseLogicAnd();
    while(peek().v==='||'){ next(); left={type:'Logic',op:'||',left,right:parseLogicAnd()}; }
    return left;
  }
  function parseLogicAnd(){
    let left = parseEquality();
    while(peek().v==='&&'){ next(); left={type:'Logic',op:'&&',left,right:parseEquality()}; }
    return left;
  }
  function parseEquality(){
    let left = parseRelational();
    while(['==','!='].includes(peek().v)){ const op=next().v; left={type:'Bin',op,left,right:parseRelational()}; }
    return left;
  }
  function parseRelational(){
    let left = parseAdditive();
    while(['<','>','<=','>='].includes(peek().v)){ const op=next().v; left={type:'Bin',op,left,right:parseAdditive()}; }
    return left;
  }
  function parseAdditive(){
    let left = parseMultiplicative();
    while(['+','-'].includes(peek().v)){ const op=next().v; left={type:'Bin',op,left,right:parseMultiplicative()}; }
    return left;
  }
  function parseMultiplicative(){
    let left = parseUnary();
    while(['*','/','%'].includes(peek().v)){ const op=next().v; left={type:'Bin',op,left,right:parseUnary()}; }
    return left;
  }
  function parseUnary(){
    if(['!','-'].includes(peek().v)){ const op=next().v; return {type:'Unary',op,arg:parseUnary()}; }
    if(['++','--'].includes(peek().v)){ const op=next().v; const arg=parseUnary(); return {type:'PreIncDec',op,arg}; }
    return parsePostfix();
  }
  function parsePostfix(){
    let e = parsePrimary();
    while(true){
      if(peek().v==='['){ next(); const idx=parseExpr(); expect(']'); e={type:'Index', arr:e, index:idx}; }
      else if(peek().v==='('){
        next();
        const args=[];
        while(peek().v!==')'){ args.push(parseExpr()); if(peek().v===',') next(); }
        expect(')');
        e = {type:'Call', callee:e, args};
      }
      else if(['++','--'].includes(peek().v)){ const op=next().v; e={type:'PostIncDec', op, arg:e}; }
      else break;
    }
    return e;
  }
  function parsePrimary(){
    const tk = peek();
    if(tk.t==='number'){ next(); return {type:'Lit', value:tk.v}; }
    if(tk.t==='string'){ next(); return {type:'Str', value:tk.v}; }
    if(tk.v==='('){ next(); const e=parseExpr(); expect(')'); return e; }
    if(tk.t==='id'){ next(); return {type:'Var', name:tk.v}; }
    next(); return {type:'Lit', value:0};
  }

  return parseProgram();
}

/* ---- Interpreter (generator-based, yields after each meaningful step) ---- */
function* runAst(stmts, env, out){
  yield* execBlockGen(stmts, env, out);
}
function* execBlockGen(stmts, env, out){
  for(const s of stmts){
    const r = yield* execStmt(s, env, out);
    if(r && (r.brk || r.cont)) return r;
  }
  return null;
}
function* execStmt(node, env, out){
  switch(node.type){
    case 'Block': return yield* execBlockGen(node.body, env, out);
    case 'Nop': return null;
    case 'VarDecl': {
      for(const d of node.decls){
        if(d.arraySize !== null){
          const size = d.init ? d.init.values.length : Math.round(evalExpr(d.arraySize, env));
          const arr = d.init ? d.init.values.map(v=>evalExpr(v, env)) : new Array(size).fill(0);
          env[d.name] = arr;
        } else {
          env[d.name] = d.init ? evalExpr(d.init, env) : 0;
        }
      }
      yield {desc:`Declared ${node.decls.map(d=>d.name).join(', ')}`, env};
      return null;
    }
    case 'ExprStmt': {
      evalExpr(node.expr, env, out);
      yield {desc:'Executed statement', env};
      return null;
    }
    case 'If': {
      const c = evalExpr(node.cond, env);
      yield {desc:`Checking if-condition → ${c?'true':'false'}`, env};
      if(c) return yield* execStmt(node.thenB, env, out);
      else if(node.elseB) return yield* execStmt(node.elseB, env, out);
      return null;
    }
    case 'For': {
      if(node.init) yield* execStmt(node.init, env, out);
      while(evalExpr(node.cond, env)){
        yield {desc:`Loop condition true → entering iteration`, env};
        const r = yield* execStmt(node.body, env, out);
        if(r && r.brk) break;
        if(node.update) evalExpr(node.update, env);
        yield {desc:`Updated loop variable`, env};
      }
      yield {desc:`Loop condition false → exiting for-loop`, env};
      return null;
    }
    case 'While': {
      while(evalExpr(node.cond, env)){
        yield {desc:`While condition true → entering iteration`, env};
        const r = yield* execStmt(node.body, env, out);
        if(r && r.brk) break;
      }
      yield {desc:`While condition false → exiting loop`, env};
      return null;
    }
    case 'DoWhile': {
      do {
        yield {desc:`Executing do-while body`, env};
        const r = yield* execStmt(node.body, env, out);
        if(r && r.brk) break;
      } while(evalExpr(node.cond, env));
      yield {desc:`do-while condition false → exiting`, env};
      return null;
    }
    case 'Break': yield {desc:'break', env}; return {brk:true};
    case 'Continue': yield {desc:'continue', env}; return {cont:true};
    default: return null;
  }
}
function evalExpr(node, env, out){
  switch(node.type){
    case 'Lit': return node.value;
    case 'Str': return node.value;
    case 'Var': return env[node.name];
    case 'Index': {
      const arr = evalExpr(node.arr, env);
      const idx = evalExpr(node.index, env);
      return arr[idx];
    }
    case 'Bin': {
      const l = evalExpr(node.left, env), r = evalExpr(node.right, env);
      switch(node.op){
        case '+': return l+r; case '-': return l-r; case '*': return l*r;
        case '/': return Math.trunc(l/r) === l/r ? l/r : l/r; // keep float div for simplicity
        case '%': return l % r;
        case '==': return (l===r)?1:0; case '!=': return (l!==r)?1:0;
        case '<': return (l<r)?1:0; case '>': return (l>r)?1:0;
        case '<=': return (l<=r)?1:0; case '>=': return (l>=r)?1:0;
      }
      return 0;
    }
    case 'Logic': {
      const l = evalExpr(node.left, env);
      if(node.op==='&&') return (l && evalExpr(node.right, env)) ? 1:0;
      return (l || evalExpr(node.right, env)) ? 1:0;
    }
    case 'Unary': {
      const v = evalExpr(node.arg, env);
      if(node.op==='-') return -v;
      if(node.op==='!') return v?0:1;
      return v;
    }
    case 'PreIncDec': {
      const nv = evalExpr(node.arg, env) + (node.op==='++'?1:-1);
      assignTo(node.arg, nv, env);
      return nv;
    }
    case 'PostIncDec': {
      const ov = evalExpr(node.arg, env);
      assignTo(node.arg, ov + (node.op==='++'?1:-1), env);
      return ov;
    }
    case 'Assign': {
      let rv = evalExpr(node.value, env);
      if(node.op!=='='){
        const cur = evalExpr(node.target, env);
        if(node.op==='+=') rv = cur+rv;
        else if(node.op==='-=') rv = cur-rv;
        else if(node.op==='*=') rv = cur*rv;
        else if(node.op==='/=') rv = cur/rv;
      }
      assignTo(node.target, rv, env);
      return rv;
    }
    case 'Call': {
      const fname = node.callee.name;
      if(fname==='printf'){
        const fmt = evalExpr(node.args[0], env);
        const args = node.args.slice(1).map(a=>evalExpr(a, env));
        let ai=0;
        const text = String(fmt).replace(/%\.?\d*[dfscl]f?/g, (m)=>{
          const v = args[ai++];
          if(m.includes('f')) return (typeof v==='number'? v.toFixed(2): v);
          return v;
        });
        if(out) out.push(text);
        return 0;
      }
      return 0;
    }
    default: return 0;
  }
}
function assignTo(target, value, env){
  if(target.type==='Var'){ env[target.name]=value; return; }
  if(target.type==='Index'){
    const arr = evalExpr(target.arr, env);
    const idx = evalExpr(target.index, env);
    arr[idx]=value; return;
  }
}

/* ---- Playground state machine ---- */
let pgGen = null, pgEnv = null, pgOut = [], pgTimer = null, pgSpeed = 450, pgRunning=false;

function pgLog(s){ document.getElementById('pgConsole').textContent = s; document.getElementById('pgConsole').scrollTop = 1e9; }
function pgSetStatus(s, cls){ const el=document.getElementById('pgStatus'); el.textContent=s; }
function pgRenderVars(env){
  const rows = Object.keys(env).map(k=>{
    let v = env[k];
    if(Array.isArray(v)) v = '['+v.join(', ')+']';
    return `<tr><td>${k}</td><td>${v}</td></tr>`;
  }).join('');
  document.getElementById('varsTable').innerHTML = '<tr><th>Name</th><th>Value</th></tr>'+rows;
}
function pgInit(){
  const src = document.getElementById('editor').value;
  let ast;
  try{
    ast = parse(tokenize(src));
  }catch(e){
    pgSetStatus('Parse error: '+e.message);
    return false;
  }
  pgEnv = {};
  pgOut = [];
  pgGen = runAst(ast, pgEnv, pgOut);
  pgLog('');
  pgRenderVars(pgEnv);
  return true;
}
function pgAdvance(){
  if(!pgGen) return false;
  try{
    const r = pgGen.next();
    pgLog(pgOut.join(''));
    if(r.done){
      pgSetStatus('Finished ✓');
      pgStopTimer();
      return false;
    } else {
      pgSetStatus(r.value.desc || 'running…');
      pgRenderVars(r.value.env || pgEnv);
      return true;
    }
  }catch(e){
    pgSetStatus('Runtime error: '+e.message);
    pgStopTimer();
    return false;
  }
}
function pgRun(){
  if(!pgGen){ if(!pgInit()) return; }
  pgRunning = true;
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnPause').disabled = false;
  pgStopTimer();
  pgTimer = setInterval(()=>{
    const cont = pgAdvance();
    if(!cont) pgPause();
  }, pgSpeed);
}
function pgPause(){
  pgRunning = false;
  pgStopTimer();
  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnPause').disabled = true;
  if(document.getElementById('pgStatus').textContent!=='Finished ✓')
    pgSetStatus(document.getElementById('pgStatus').textContent + '  (paused)');
}
function pgStopTimer(){ if(pgTimer){ clearInterval(pgTimer); pgTimer=null; } }
function pgStep(){
  if(!pgGen){ if(!pgInit()) return; }
  pgPause();
  pgAdvance();
}
function pgReset(){
  pgStopTimer();
  pgRunning = false;
  pgGen = null; pgEnv=null; pgOut=[];
  document.getElementById('btnRun').disabled = false;
  document.getElementById('btnPause').disabled = true;
  pgSetStatus('idle');
  pgLog('');
  document.getElementById('varsTable').innerHTML = '<tr><th>Name</th><th>Value</th></tr>';
}
function pgSetSpeed(){
  pgSpeed = parseInt(document.getElementById('speedSelect').value);
  if(pgRunning){ pgStopTimer(); pgRun(); }
}

populateExamples();
loadExample();
